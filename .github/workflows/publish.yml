# Publish dsh-islands-ui to npm via npm Trusted Publishing (OIDC).
#
# No long-lived NPM_TOKEN is stored: the publish step exchanges this
# workflow's OIDC token for a short-lived npm credential, and --provenance
# signs the tarball with the same identity.
#
# Trigger:
#   - push a tag like v1.1.2 (must match package.json version)
#   - or run the workflow manually once the version is ready
name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify build and package
        run: npm run check

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v'+p.version) { console.error('tag '+tag+' does not match package version v'+p.version); process.exit(1); }"

      - name: Publish
        # Trusted Publishing: npm exchanges the workflow's OIDC token for a
        # short-lived publish credential, so no long-lived NPM_TOKEN secret is
        # needed. `--provenance` signs the tarball with the same identity.
        run: npm publish --access public --provenance
