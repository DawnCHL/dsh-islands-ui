# Publish dsh-islands-ui to npm.
#
# Requires an `NPM_TOKEN` repository secret with publish access to the
# dsh-islands-ui package. Prefer npm Trusted Publishing once the package
# exists; this workflow keeps the token path working for the first release.
#
# Trigger:
#   - push a tag like v1.0.0 (must match package.json version)
#   - or run the workflow manually once the version is ready
name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify build and package
        run: npm run check

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v'+p.version) { console.error('tag '+tag+' does not match package version v'+p.version); process.exit(1); }"

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
